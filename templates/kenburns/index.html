<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ken Burns Template</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
    #scene {
      position: absolute; inset: 0; overflow: hidden;
    }
    #img {
      position: absolute;
      transform-origin: center center;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #title-text {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font: 700 72px/1.2 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      text-shadow: 0 4px 40px rgba(0,0,0,0.8);
      text-align: center; padding: 80px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="scene">
    <img id="img" src="photo.jpg" alt="">
    <div id="title-text">Your Title Here</div>
  </div>

  <script>
    const defaults = { src: 'photo.jpg', title: 'Your Title Here', zoomFrom: 1.0, zoomTo: 1.15 };
    let props = defaults;
    try { props = { ...defaults, ...(window._hyperframeProps || {}) }; } catch (_) {}

    const img   = document.getElementById('img');
    const title = document.getElementById('title-text');
    img.src = props.src;
    title.textContent = props.title;

    const FPS = 30;
    const TOTAL = 150; // 5s

    window.hyperframe = { fps: FPS, durationInFrames: TOTAL, width: 1920, height: 1080 };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    window.setFrame = function(frame) {
      const t = easeInOut(frame / (TOTAL - 1));
      const scale = lerp(props.zoomFrom, props.zoomTo, t);
      // Slow pan from top-left to bottom-right
      const tx = lerp(-1, 1, t);
      const ty = lerp(-0.5, 0.5, t);
      img.style.transform = `scale(${scale}) translate(${tx}%, ${ty}%)`;

      // Fade-in title in the second quarter
      const fadeStart = TOTAL * 0.3;
      const fadeEnd   = TOTAL * 0.6;
      if (frame >= fadeStart && frame <= fadeEnd) {
        title.style.opacity = String((frame - fadeStart) / (fadeEnd - fadeStart));
      } else if (frame > fadeEnd) {
        title.style.opacity = '1';
      }
    };

    window.setFrame(0);
  </script>
</body>
</html>
